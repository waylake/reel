name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Reel aims to stay small and simple. The best requests describe the *problem* first.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      placeholder: "When I download a lecture series, I have to..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like Reel to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a pull request for this
